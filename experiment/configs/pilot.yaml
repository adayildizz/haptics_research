# Staircase pilot config: locate the approximate JND at a new base height
# before committing to a constant-stimuli delta_max_pct range.

base_height_mm: 10.0
bar_width_mm: 10.0
inter_bar_gap_mm: 40.0

delta_max_pct: 0.30  # only used for the post-pilot range-check warning

staircase_dh_start_pct: 2.0
staircase_dh_min_pct: 0.5
staircase_dh_step_pct: 0.1
staircase_n_reversals: 12
staircase_n_reversals_averaged: 8

rng_seed: null
participant_id: ""
mode: staircase_pilot
